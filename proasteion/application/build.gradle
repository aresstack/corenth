description = 'Outer composition root: wires policies, archive counter, connectors, inspection, index and lifecycle for hosts.'

dependencies {
    // Inner contracts and use cases exposed to hosts (lifecycle, search, mediated access).
    api project(':astu:acropolis')

    // Concrete outer adapters are known only here and never leak through the public API.
    implementation project(':proasteion:emporion:holkas')
    implementation project(':proasteion:emporion:deigma')
    implementation project(':proasteion:emporion:deigma-html')
    implementation project(':proasteion:emporion:deigma-pdf')
    implementation project(':proasteion:emporion:deigma-office')

    testImplementation 'junit:junit:4.13.2'
    // Fixture generation for the PDF and Office acceptance tests; no binary fixtures are checked in.
    testImplementation 'org.apache.pdfbox:pdfbox:2.0.37'
    testImplementation 'org.apache.poi:poi-ooxml:5.2.5'
    // Bounded retrieval check over the composed lexical index (#7); Pinakes is not wired into the host yet.
    testImplementation project(':astu:acropolis:chalcotheca:pinakes')
    testImplementation testFixtures(project(':astu:acropolis:chalcotheca:pinakes'))
}

tasks.named('test') {
    // The composition must work without a display (ADR-0001, guard rail 3).
    systemProperty 'java.awt.headless', 'true'
}
