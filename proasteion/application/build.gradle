description = 'Outer composition root: wires policies, archive counter, connectors, inspection, index and lifecycle for hosts.'

dependencies {
    // Inner contracts and use cases exposed to hosts (lifecycle, search, mediated access).
    api project(':astu:acropolis')

    // Tool capability contracts that the composed use cases are bound to (#12).
    api project(':proasteion:katagogion')

    // Concrete outer adapters are known only here and never leak through the public API.
    implementation project(':proasteion:emporion:holkas')
    implementation project(':proasteion:emporion:deigma')

    testImplementation 'junit:junit:4.13.2'
}

tasks.named('test') {
    // The composition must work without a display (ADR-0001, guard rail 3).
    systemProperty 'java.awt.headless', 'true'
}
