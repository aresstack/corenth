description = 'Plugin and tool lodging house: explicit tool registration, admission and mediated tool capabilities.'

dependencies {
    // Stable inner identities (VirtualResourceRef) are part of the tool capability contracts.
    api project(':astu')

    // Existing mediated use cases (SearchCoordinator) adapted into tool capabilities.
    implementation project(':astu:acropolis')

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
