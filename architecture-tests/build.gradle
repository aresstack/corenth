description = 'Executable architecture boundary rules.'

ext.architectureProjects = [
        ':adyton',
        ':astu',
        ':astu:propylaea',
        ':astu:acropolis',
        ':astu:acropolis:chalcotheca',
        ':astu:acropolis:chalcotheca:tamias',
        ':astu:acropolis:chalcotheca:anagraphai',
        ':astu:acropolis:chalcotheca:pinakes',
        ':proasteion',
        ':proasteion:exedra',
        ':proasteion:katagogion',
        ':proasteion:emporion',
        ':proasteion:emporion:holkas',
        ':proasteion:emporion:deigma',
        ':proasteion:emporion:deigma-html',
        ':proasteion:emporion:deigma-pdf',
        ':proasteion:emporion:deigma-office',
        ':proasteion:application',
        ':proasteion:platform',
        ':proasteion:platform:network',
        ':proasteion:platform:network-winproxy',
        ':proasteion:platform:security-keepassrpc',
        ':proasteion:platform:security-prompt'
]

// Every Gradle project that compiles production classes must be listed explicitly above so that
// its classes are imported by CorenthArchitectureRulesTest. This guard turns a forgotten entry
// (for example a future ':proasteion:application' bootstrap module, see
// docs/adr/0001-composition-root.md) into a configuration failure instead of silently unscanned code.
def unlistedProjects = rootProject.subprojects
        .findAll { candidate -> candidate.path != project.path && !architectureProjects.contains(candidate.path) }
        .collect { candidate -> candidate.path }
        .sort()
if (!unlistedProjects.isEmpty()) {
    throw new GradleException("architecture-tests: these Gradle projects are not covered by the architecture rules; "
            + "add them to architectureProjects in architecture-tests/build.gradle: " + unlistedProjects)
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'

}

tasks.named('test') {
    useJUnitPlatform()
    dependsOn architectureProjects.collect { architectureProject ->
        project(architectureProject).tasks.named('classes')
    }

    def productionClassDirectories = architectureProjects.collectMany { architectureProject ->
        project(architectureProject).sourceSets.main.output.classesDirs.files
    }

    inputs.files(productionClassDirectories)

    doFirst {
        def existingClassDirectories = productionClassDirectories.findAll { classDirectory ->
            classDirectory.exists()
        }
        systemProperty 'corenth.architecture.classpath', existingClassDirectories.join(File.pathSeparator)
    }
}
